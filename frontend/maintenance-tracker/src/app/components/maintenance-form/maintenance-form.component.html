<h3>Add Maintenance Record</h3>

<form [formGroup]="maintenanceForm" (ngSubmit)="submit()">

  <div>
    <label for="date">Date</label>
    <input
      id="date"
      type="date"
      formControlName="date">

    <div *ngIf="maintenanceForm.controls.date.touched && maintenanceForm.controls.date.invalid">
      Date is required.
    </div>
  </div>

  <div>
    <label for="description">Description</label>
    <input
      id="description"
      type="text"
      formControlName="description">

    <div *ngIf="maintenanceForm.controls.description.touched && maintenanceForm.controls.description.invalid">
      Description is required.
    </div>
  </div>

  <div>
    <label for="technician">Technician</label>
    <input
      id="technician"
      type="text"
      formControlName="technician">

    <div *ngIf="maintenanceForm.controls.technician.touched && maintenanceForm.controls.technician.invalid">
      Technician is required.
    </div>
  </div>

  <div>
    <label for="cost">Cost</label>
    <input
      id="cost"
      type="number"
      step="0.01"
      min="0"
      formControlName="cost">
  </div>

  <button type="submit">Add Maintenance</button>

</form>

<div *ngIf="errorMessage">
  {{ errorMessage }}
</div>
